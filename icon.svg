<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Clean white squircle icon background (iOS rounded corner profile rx=112) -->
  <rect width="512" height="512" fill="#FFFFFF" rx="112" />

  <!-- Ultra-subtle hairline border to guarantee edge definition on white backgrounds -->
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#EAEAEA" stroke-width="2" />

  <!-- Monolithic Geometric Grotesk 'N' - Centered, bold, high architectural impact -->
  <g fill="#000000">
    <!-- Centered single monogram N with balanced heavy proportions -->
    <polygon points="136,116 216,116 296,288 296,116 376,116 376,396 296,396 216,224 216,396 136,396" />
  </g>
</svg>